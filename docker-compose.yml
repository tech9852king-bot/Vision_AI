services:
  vanta-funding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanta-funding-prototype
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./vanta_vision.db
      - ENVIRONMENT=production
      - REAL_CAMERA_CONFIGURED=false
      - CAMERA_PROVIDER=SIMULATED
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

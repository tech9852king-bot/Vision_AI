services:
  vanta-funding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanta-funding-prototype
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/vanta_vision.db
      - DATABASE_PATH=/app/data/vanta_vision.db
      - ENVIRONMENT=production
      - REAL_CAMERA_CONFIGURED=false
      - CAMERA_PROVIDER=MULTI_DEVICE_EDGE
      - GEMINI_LIVE_MODEL=gemini-3.8-live
      - GEMINI_REASONING_MODEL=gemini-3.8-flash
      - GEMINI_TTS_MODEL=gemini-3.8-flash-tts
      - GEMINI_TTS_LITE_MODEL=gemini-3.8-flash-lite-tts
      - GEMINI_TRANSCRIBE_MODEL=gemini-3.5-transcribe
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
